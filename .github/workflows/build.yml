name: Test and Deploy
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
    - uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'
    - run: pip install -r requirements.txt
    - run: pytest
    - run: node --test test_checklist.js
    - run: curl -fsS "${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}"
